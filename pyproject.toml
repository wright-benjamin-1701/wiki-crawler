[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wiki-dumps"
version = "0.1.0"
description = "Download and process Wikipedia XML dumps in parallel, writing extracted data to SQLAlchemy-managed SQLite/PostgreSQL databases."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ben Wright" }]
keywords = ["wikipedia", "nlp", "sqlite", "sqlalchemy", "dask", "xml"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: XML",
    "Topic :: Database",
]
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "rich>=13",
    "typer>=0.12",
    "lxml>=5",
    "lxml-stubs>=0.5",
    "mwparserfromhell>=0.6",
    "pydantic-settings>=2",
    "python-dotenv>=1",
]

[project.urls]
Repository = "https://github.com/benwright/wiki-dumps"

[project.scripts]
wiki = "wiki_dumps.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wiki_dumps"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.ruff]
src = ["src"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN"]
ignore = [
    "ANN401",  # Any is necessary when wrapping untyped third-party libs (mwparserfromhell)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
dev-dependencies = [
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-httpx>=0.36.2",
    "ruff>=0.15.12",
    "pandas>=3.0.2",
    "dask[dataframe]>=2026.3.0",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
    "jupyter>=1.1.1",
    "ipykernel>=7.2.0",
    "mwparserfromhell>=0.7.2",
    "scikit-learn>=1.8.0",
    "umap-learn>=0.5.12",
    "plotly>=6.7.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "networkx>=3.6.1",
]
